{% extends "layout.html" %}
{% block title %}Add Question Manually{% endblock %}
{% block content %}
  <h2>Add Question Manually</h2>

  <form method="post" action="{{ url_for('add_questions_manual_form') }}">
    <label for="subject_id">Subject ID:</label>
    <input type="text" id="subject_id" name="subject_id" required value="{{ subject_id_preset or '' }}"
           placeholder="e.g., CS101">

    <label for="question_text">Question Text:</label>
    <textarea id="question_text" name="question_text" rows="3" required></textarea>

    <label for="option_a">Option A:</label>
    <input type="text" id="option_a" name="option_a" required>

    <label for="option_b">Option B:</label>
    <input type="text" id="option_b" name="option_b" required>

    <label for="option_c">Option C:</label>
    <input type="text" id="option_c" name="option_c" required>

    <label for="option_d">Option D:</label>
    <input type="text" id="option_d" name="option_d" required>

    <label for="correct_option_letter">Correct Option Letter:</label>
    <select id="correct_option_letter" name="correct_option_letter" required>
        <option value="">-- Select Correct Answer --</option>
        <option value="A">A</option>
        <option value="B">B</option>
        <option value="C">C</option>
        <option value="D">D</option>
    </select>

    <label for="marks">Marks:</label>
    <input type="number" id="marks" name="marks" required min="1" value="1">

    <br><br>
    <button type="submit">Add This Question</button>
  </form>

  <p><a href="{{ url_for('teacher_dashboard') }}">Back to Dashboard</a></p>
{% endblock %}
